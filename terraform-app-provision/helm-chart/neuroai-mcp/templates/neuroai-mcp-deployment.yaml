apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.neuroaimcp.neuroaiMcpDeploy.name }}
  namespace: {{ .Values.global.namespace }}

spec:
  replicas: {{ .Values.global.replicaCount }}

  selector:
    matchLabels:
      app: {{ .Values.global.appName }}

  template:
    metadata:
      labels:
        {{- toYaml .Values.global.labels | nindent 4 }}
    spec:
      {{- if .Values.neuroaimcp.neuroaiMcpDeploy.serviceAccount }}
      serviceAccountName: {{ .Values.neuroaimcp.neuroaiMcpDeploy.serviceAccount.name }}
      {{- end }}
      {{- if .Values.neuroaimcp.neuroaiMcpDeploy.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.neuroaimcp.neuroaiMcpDeploy.imagePullSecrets }}
      {{- end }}
      containers:

        - name: {{ .Values.global.appName }}
          image: {{ .Values.neuroaimcp.neuroaiMcpDeploy.image }}
          imagePullPolicy: {{ .Values.neuroaimcp.neuroaiMcpDeploy.imagePullPolicy }}

          resources:
            requests:
              memory: "1024Mi"
              cpu: "500m"
            limits:
              memory: "1500Mi"
              cpu: "1000m"

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: {{ .Values.global.appName }}-cm
            - secretRef:
                name: {{ .Values.global.appName }}-secrets
            

          volumeMounts:

          {{- if .Values.neuroaimcp.neuroaimcpSecrets.useSecretProvider }}            
          - mountPath: /mnt/secrets-store
            name: secrets-store-inline
            readOnly: true
          {{- end }}

      volumes:
        {{- if .Values.neuroaimcp.neuroaimcpSecrets.useSecretProvider }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.global.appName }}-secrets-provider
        {{- end }}
      restartPolicy: Always
 

      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64