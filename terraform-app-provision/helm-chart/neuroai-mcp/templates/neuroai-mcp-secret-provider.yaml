{{- if .Values.neuroaimcp.neuroaimcpSecrets.useSecretProvider }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.global.appName }}-secrets-provider
  namespace: {{ .Values.global.namespace }}
spec:
  provider: {{ .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.provider }}
  parameters:
  {{- if eq .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.provider "azure" }}
   # parameter values for Azure
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.azure.userManagedIdentityClientId }}
    keyvaultName: {{ .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.azure.keyvaultName }}
    tenantId: {{ .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.azure.tenantId }}
    objects: |
      array:
      {{- range $secretObject := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.secretObjects }}
        - |
          objectName: {{ $secretObject.keyVaultObjectName }}
          objectType: secret
          objectVersion: ""
      {{ end }}
  secretObjects:
    - secretName: {{ .Values.global.appName }}-secrets
      data:
      {{- range $secretObject := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.secretObjects }}
      - key: {{ $secretObject.secretName }}
        objectName: {{ $secretObject.keyVaultObjectName }}
      {{- end }}        
      type: Opaque
 
  {{- else if eq .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.provider "aws" }}
    # parameter values for AWS
    region: {{ .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.aws.region }}
    objects: |
      - objectName: {{ .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.aws.secretARN }}
        objectType: secretsmanager
        jmesPath:
        {{- range $secretObject := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.secretObjects }}
          - path: {{ $secretObject.keyVaultObjectName }}
            objectAlias: {{ $secretObject.secretName }}
      {{ end }}
  secretObjects:
    - secretName: {{ .Values.global.appName }}-secrets
      data:
      {{- range $secretObject := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.secretObjects }}
      - key: {{ $secretObject.secretName }}
        objectName: {{ $secretObject.secretName }}
      {{- end }}        
      type: Opaque

  # GCP Secret Manager
  {{- else if eq .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.provider "gcp" }}
  {{- $project := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.gcp.project }}
  {{- $resourceName := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.gcp.resourceName }}
    secrets: |
    {{- range $secretObject := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.secretObjects }}
      - resourceName: {{$resourceName}}
        path: {{ $secretObject.secretName }}
        extractJSONKey: {{ $secretObject.secretName }}
    {{ end }}
  secretObjects:
    - secretName: {{ .Values.global.appName }}-secrets
      data:
      {{- range $secretObject := .Values.neuroaimcp.neuroaimcpSecrets.secretproviderDetails.secretObjects }}
      - key: {{ $secretObject.secretName }}
        objectName: {{ $secretObject.secretName }}
      {{- end }}        
      type: Opaque
 
  {{- end }}
{{- end }}