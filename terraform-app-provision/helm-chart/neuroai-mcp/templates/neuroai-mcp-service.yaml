# kubernetes/neuroai-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.neuroaimcp.service.name }}
  namespace: {{ .Values.global.namespace }}  
spec:
  type: {{ .Values.neuroaimcp.service.type }}
  selector:
    app: {{ .Values.global.appName}}
  ports:
    - name: http
      port: 8080
      targetPort: 8080 # Changed from "http" to 8080 to match MCP server port
      protocol: TCP
      approtocol: HTTP