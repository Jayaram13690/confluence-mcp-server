{{- if .Values.neuroaimcp.neuroaiMcpDeploy.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.neuroaimcp.neuroaiMcpDeploy.serviceAccount.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
  {{- with .Values.neuroaimcp.neuroaiMcpDeploy.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}